services:
  paranoid-docker-update:
    image: ghcr.io/lorenzo-dm/paranoid-docker:latest
    container_name: paranoid-docker-update
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Non-root is a documented opt-in: uncomment and set the group to your
    # host's docker socket GID (stat -c %g /var/run/docker.sock).
    # user: "1000:<docker-gid>"
    ports:
      - "1323:1323"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - rollbacks:/app/rollbacks
      - images:/app/images
      - data:/app/data
      # Optional: mount the directory containing your compose stacks to enable
      # file-based rollbacks and native `docker compose` updates.
      # Set COMPOSE_STACKS_DIR to the host path (e.g. /home/user/stacks).
      # - ${COMPOSE_STACKS_DIR}:${COMPOSE_STACKS_DIR}:ro
    environment:
      - TZ=Europe/Rome
      - LISTEN_ADDR=:1323

volumes:
  rollbacks:
  images:
  data:
