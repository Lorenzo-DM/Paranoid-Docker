services:
    fullapp:
        image: example/app@sha256:pinned
        container_name: fullapp
        command:
            - serve
            - --verbose
        entrypoint:
            - /entrypoint.sh
        user: 1000:1000
        working_dir: /srv
        hostname: fullapp
        domainname: internal
        stop_signal: SIGQUIT
        stop_grace_period: 30s
        restart: on-failure:3
        ports:
            - 0.0.0.0:9090:9090/tcp
            - 127.0.0.1:8080:80/tcp
            - 5353:53/udp
        volumes:
            - /host/config:/etc/app:ro
            - /host/data:/data
            - /anon
            - /host/extra:/extra
            - appdata:/var/lib/app
            - cache-ro:/cache:ro
        tmpfs:
            - /run:size=64m
            - /tmp
        devices:
            - /dev/snd:/dev/snd
        cap_add:
            - NET_ADMIN
        cap_drop:
            - MKNOD
        read_only: true
        init: true
        security_opt:
            - no-new-privileges:true
        sysctls:
            net.ipv4.ip_forward: "1"
        ulimits:
            nofile:
                soft: 1024
                hard: 4096
        group_add:
            - video
        dns:
            - 1.1.1.1
        dns_search:
            - example.internal
        extra_hosts:
            - db.local:10.0.0.5
        shm_size: 67108864
        environment:
            - MODE=prod
            - TOKEN=secret
        labels:
            app.tier: backend
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        healthcheck:
            test:
                - CMD
                - curl
                - -f
                - http://localhost/health
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 1m30s
        networks:
            appnet:
                aliases:
                    - app
                ipv4_address: 172.28.0.10
            backnet: {}
        mem_limit: 536870912
        mem_reservation: 268435456
        cpu_shares: 512
        cpus: "1.5"
        cpuset: 0,1
        pids_limit: 200
networks:
    appnet:
        external: true
    backnet:
        external: true
volumes:
    appdata:
        external: true
    cache-ro:
        external: true
